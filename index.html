<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>E급부터 시작하는 헌터</title>

<style>

body{
    margin:0;
    background:#0b0d12;
    color:white;
    font-family:sans-serif;
}

header{
    padding:80px 20px;
    text-align:center;
    background:linear-gradient(to bottom,#111827,#0b0d12);
}

h1{
    font-size:60px;
    margin-bottom:10px;
}

.subtitle{
    color:#9ca3af;
    font-size:18px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:40px 20px;
}

.card{
    background:#151922;
    border:1px solid #2b3242;
    border-radius:20px;
    padding:25px;
    margin-bottom:25px;
}

.card h2{
    margin-top:0;
    color:#c084fc;
}

.system{
    color:#93c5fd;
}

.footer{
    text-align:center;
    color:#666;
    padding:50px 20px;
}

</style>
</head>

<body>

<header>
    <h1>E급부터 시작하는 헌터</h1>
    <p class="subtitle">
        세계는 당신의 죽음을 원하지 않는다
    </p>
</header>

<div class="container">

    <div class="card">
        <h2>📖 세계관</h2>

        <p>
            게이트와 몬스터가 출현한 시대.
            헌터들은 각자의 능력으로 인류를 지켜낸다.
        </p>

        <p>
            하지만 당신은 가장 낮은 등급인 E급으로 각성하게 된다.
        </p>
    </div>

    <div class="card">
        <h2>⚔ 주요 시스템</h2>

        <p class="system">
            [𝕋] 실제등급 시스템
        </p>

        <p class="system">
            관계 이모지 시스템
        </p>

        <p class="system">
            성장 프로토콜
        </p>
    </div>

    <div class="card">
        <h2>🩸 주요 인물</h2>

        <p>
            정도현 / 그림자 묘지
        </p>

        <p>
            백무결 / 성계의 붕괴
        </p>

        <p>
            유채린 / 안식
        </p>
    </div>

</div>

<div class="footer">
    E-RANK HUNTER PROJECT
</div>

</body>
</html>
